name: Update GeoIP Database
on:
  schedule:
    - cron: '0 0 * * 0' # Runs every Sunday at midnight
  workflow_dispatch: 

jobs:
  update-db:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (shallow clone)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1 

      - name: Download Latest Country DB
        run: |
          mkdir -p data
          # Direct GitHub raw download bypasses the CDN to prevent connection timeouts
          curl -L "https://githubusercontent.com" -o data/GeoLite2-Country.mmdb.gz
          gunzip -f data/GeoLite2-Country.mmdb.gz

      - name: Force Push Update (Cleans History)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add data/GeoLite2-Country.mmdb
          
          if ! git diff-index --quiet HEAD; then
            git commit --amend -m "chore: automated geoip database update" || git commit -m "chore: automated geoip database update"
            git push origin HEAD --force
          else
            echo "No changes detected in the database."
          fi
